name: Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-panel:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: control-panel/requirements.txt

      - name: Validate system flow model
        run: |
          python scripts/validate-system-flow.py
          python scripts/render-system-flow.py --check
          python -m unittest discover -s tests -p "test_*.py"

      - name: Install control-panel dependencies
        run: python -m pip install -r control-panel/requirements.txt

      - name: Compile Python
        run: python -m compileall -q control-panel

      - name: Smoke-test repository inventory
        run: python -c "import runpy; app = runpy.run_path('control-panel/app.py'); assert len(app['collect_repository_statuses']()) == 3"

      - name: Parse PowerShell maintenance scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw "PowerShell parse errors found."
          }
